apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
spec:
  destination:
    namespace: projet-mef-sg-dsci
    server: https://kubernetes.default.svc
  source:
    path: argocd/sealed-secrets
    repoURL: https://github.com/ytihianine/deploiement-application.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values-prod.yaml
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
